[package]
name = "bybit_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bybit_rs"
path = "src/main.rs"

[[bin]]
name = "marketdata"
path = "src/bin/marketdata.rs"

[dependencies]
anyhow = "1.0.104"
arrow = "59.2.0"
chrono = "0.4.45"
futures-util = "0.3.34"
parquet = { version = "59.2.0", features = ["arrow"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
