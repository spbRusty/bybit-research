# --- Ось regime: AND с режимным фильтром ---

[regimes]
volatility_high = "pl.col('volatility_regime').is_in(['high', 'very_high'])"
volatility_low = "pl.col('volatility_regime').is_in(['low', 'very_low'])"
volatility_normal = "pl.col('volatility_regime') == 'normal'"
btc_up = "pl.col('btc_trend_regime') > 0"
btc_down = "pl.col('btc_trend_regime') < 0"
liquidity_high = "pl.col('liquidity_regime') == 'high'"
liquidity_thin = "pl.col('liquidity_regime').is_in(['normal', 'low'])"
breadth_positive = "pl.col('market_breadth_regime') > 0"
corr_high = "pl.col('correlation_regime') == 'high'"
corr_low = "pl.col('correlation_regime') == 'low'"
session_asia = "pl.col('session') == 'asia'"
session_europe = "pl.col('session') == 'europe'"
session_america = "pl.col('session') == 'america'"

# --- Ось combination: второе условие для CONDITIONAL (AND, <= 2 условий) ---

[combinations]
volatility_high = "pl.col('volatility_regime').is_in(['high', 'very_high'])"
volatility_low = "pl.col('volatility_regime').is_in(['low', 'very_low'])"
btc_up = "pl.col('btc_trend_regime') > 0"
btc_down = "pl.col('btc_trend_regime') < 0"
liquidity_high = "pl.col('liquidity_regime') == 'high'"
breadth_positive = "pl.col('market_breadth_regime') > 0"
corr_high = "pl.col('correlation_regime') == 'high'"
corr_low = "pl.col('correlation_regime') == 'low'"
session_europe = "pl.col('session') == 'europe'"
session_america = "pl.col('session') == 'america'"
