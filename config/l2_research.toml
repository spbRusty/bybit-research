# L2 (orderbook-feature) hypothesis screening — PRE-REGISTERED 2026-10-06,
# BEFORE any L2 screening results were seen.
#
# This is a SEPARATE pre-registered feature family, NOT a relaxation of the
# frozen candle study (config/research.toml). OB capture starts 2026-09-07,
# which sits outside the frozen candle sample periods (end 2026-09-02), so L2
# needs its own calendar. Gates below are mirrored from research.toml with the
# SAME values — never weakened.
#
# CORRECTION 2026-10-16 (pre-acceptance: no acceptance run has ever executed,
# no validation/oos data exists): the previous 30d validation/oos windows were
# gated by min_months=3, which is geometrically unsatisfiable — a window of at
# most 2 calendar months can never contain 3 distinct months — so `finalists`
# was always empty and the study could never yield a candidate. min_months is a
# DISCOVERY-only gate (regime coverage of the fitting period); validation/oos
# now confirm on {min_events, min_unique_symbols, min_t_stat, mean_net>0} only,
# via meets(..., require_months=False). Validation/oos shortened 30d->14d to
# reach the first verdict sooner. Gate VALUES are unchanged (not weakened);
# only their SCOPE was corrected.
#
# Rationale for periods: ~67d discovery + 14d validation + 14d OOS. Discovery
# must reach into November because min_months=3 needs Sep+Oct+Nov; ending it
# 2026-11-05 would leave the third month dependent on a 4-day window that a
# capture gap could erase — hence the 2026-11-12 end (slack). ACCEPTANCE_DATE is
# derived as oos close + 1 day (the last day's partition/returns finalize after
# the window closes); the first conclusive acceptance run can happen on/after
# 2026-12-11. A holdout is only "complete" once it carries >=10 distinct
# captured days (see MIN_PERIOD_DAYS), so a near-empty window cannot pass.

[periods]
# First event 2026-09-07; discovery must span 3 calendar months (Sep/Oct/Nov).
discovery  = ["2026-09-06", "2026-11-12"]
validation = ["2026-11-12", "2026-11-26"]
oos        = ["2026-11-26", "2026-12-10"]

[gates]
# Mirrored from config/research.toml — identical values, not weakened.
min_events = 100            # same as research.toml §min_events, not weakened
min_unique_symbols = 5      # same as research.toml §min_unique_symbols, not weakened
min_months = 3              # same as research.toml §min_months, not weakened
bh_q = 0.05                 # same as research.toml §bh_q, not weakened
survival_cost = 0.0020      # same as research.toml §survival_cost, not weakened
min_t_stat = 2.0            # same as research.toml §min_t_stat (acceptance threshold used by screen.py), not weakened
cost_grid_round_trip = [0.0010, 0.0015, 0.0020, 0.0030]  # same as research.toml §cost_grid_round_trip, not weakened

[features]
# Only ob_* columns enter L2 hypothesis generation.
whitelist_prefix = "ob_"