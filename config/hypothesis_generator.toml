# Ограниченный Hypothesis Generator (ТЗ §22-24, §38)
id_prefix = "HG"
min_events = 100          # мин. частота события (cheap filter)

# Пороги по процентилю для признаков, где не задан абсолютный порог в коде.
# Для признаков из _THR_ABS используются абсолютные значения; здесь — только
# признаки, у которых порог считается по распределению.
[thresholds]

# Лимиты комбинаторного пространства (§38)
max_conditions_per_hyp = 2
max_features_per_hyp = 2
dedup_by = "condition"    # дедупликация эквивалентных условий
