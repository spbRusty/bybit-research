# Риск бумажной торговли (ТЗ §36, §37)
equity_start = 10_000.0
risk_per_trade_pct = 0.01        # допустимый денежный риск на сделку, 1% капитала
stop_k_vol = 2.0                 # стоп = k x волатильность (Гарман–Класс)
take_k_stop = 1.5                # тейк = take_k_stop x дистанция до стопа
slippage_bps = 2.0               # проскальзывание, базисные пункты (0.02%)
instrument_min_lot = 0.001       # минимальное количество (стартовое значение)
instrument_min_notional = 5.0    # минимальная стоимость заявки, USDT (стартовое)
instrument_qty_step = 0.001      # шаг количества
fee_round_trip = 0.0015          # комиссия кругового оборота = 0.15% номинала